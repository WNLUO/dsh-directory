[package]
name = "dsh-directory"
version = "0.1.0"
edition = "2021"
description = "公用中转总控（地址目录）：设备上报连接地址，APP 查询 / 订阅地址变化"
license = "MIT"

[[bin]]
name = "dsh-directory"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
# 离线推送：APNs 只收 HTTP/2（`http2` 必须显式打开），签名用 ES256。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"] }
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
